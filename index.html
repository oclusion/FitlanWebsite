<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitlán Academy | Cursos de Fitness y Entrenamiento Online</title>
    <meta name="description" content="Entrena desde cualquier lugar con Fitlán Academy. Cursos online de box, yoga, atletismo, karate y más disciplinas, con acceso ilimitado y nuevos entrenamientos constantemente." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <!-- "Opening" es la fuente de los títulos grandes (h1/h2 — "VINYASA",
         "Notificaciones", etc.), muy distinta en métricas a la fuente de
         respaldo. Sin preload, el navegador recién la pide cuando parsea el
         @font-face de styles.css y encuentra texto que la usa — con
         font-display:swap eso se nota como un salto de layout al llegar. El
         preload la arranca a descargar en paralelo con el resto del HTML. -->
    <link rel="preload" href="/src/assets/fonts/opening-webfont.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Fitlan" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Fitlán Academy | Entrena diferente">
    <meta property="og:description" content="Box, yoga, atletismo y más. Entrena a tu ritmo con cursos deportivos en video.">
    <meta property="og:url" content="https://fitlanacademy.com/">
    <meta property="og:image" content="https://fitlan.s3.amazonaws.com/uploads/fitlan-og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Fitlán Academy">
    <meta property="og:locale" content="es_MX">

    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fitlán Academy | Entrena diferente">
    <meta name="twitter:description" content="Box, yoga, atletismo y más. Entrena a tu ritmo con cursos deportivos en video.">
    <meta name="twitter:image" content="https://fitlan.s3.amazonaws.com/uploads/fitlan-og.png">

  </head>
